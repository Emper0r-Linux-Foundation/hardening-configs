# Emperor Linux hardened profile for servers and Secure Boot images.
# Install as /etc/sysctl.d/99-emperor-hardened.conf only when the trade-offs
# below are acceptable. Do not ship it as the desktop default.

kernel.kptr_restrict = 2
kernel.perf_event_paranoid = 3
# Write-once; disables kexec/kdump loading for this boot.
kernel.kexec_load_disabled = 1
kernel.sysrq = 0
# Breaks Flatpak, containers, bwrap, and some browser sandboxes.
user.max_user_namespaces = 0
# 2 disables io_uring even for root; breaks applications that use it.
kernel.io_uring_disabled = 2
